# Copilot + Power BI Desktop MCP Bridge 설정
server:
  port: 5050
  host: "127.0.0.1"

mcp:
  # powerbi-modeling-mcp.exe 경로
  command: "powerbi-modeling-mcp.exe"
  args: []
  # 작업 디렉토리 (비워두면 Bridge 실행 위치)
  # cwd: "C:\\path\\to\\mcp"
  startupTimeoutMs: 10000
  requestTimeoutMs: 30000

security:
  # API Key 인증 (빈 값이면 인증 비활성화)
  # apiKey: "your-secret-key-here"
  corsOrigins:
    - "*"

logging:
  level: "info"  # debug, info, warn, error
  # file: "logs/bridge.log"

# Filesystem 도구 (Bridge에 내장된 파일 조작 MCP — Node.js 추가 설치 불필요).
# Copilot Studio에서 read_file / write_file / list_directory / search_files 등을 호출할 수 있다.
filesystem:
  enabled: true
  # 파일 작업이 허용되는 디렉터리 (절대경로). 비워두면 자동으로
  # {Bridge 실행 위치}/workspace 가 추가된다. 필요 시 아래에 명시적으로 추가:
  # allowedPaths:
  #   - "C:\\pbi-mcp-bridge\\workspace"
  #   - "C:\\Users\\YourName\\Documents\\PowerBI-MCP"
  allowedPaths: []
  maxFileSizeBytes: 10485760    # 10MB — 단일 파일 읽기/쓰기 한도
  maxSearchResults: 1000        # search_files 결과 최대 개수
